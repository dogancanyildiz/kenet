name: iOS derlemesi (test için)
description: >-
  Xcode seçimi, paket önbelleği, XcodeGen, proje üretimi, tek simülatör seçimi ve build-for-testing.
  iOS test işlerinin ortak başlangıcı; çağıran iş önce depoyu çeker (actions/checkout), sonra
  derlemeden sonra simülatörü açar (simctl bootstatus -b). Her iş tek cihaz ailesini koşar:
  `family: iphone` ya da `family: ipad`.

inputs:
  family:
    description: Seçilecek simülatörün cihaz ailesi ("iphone" / "ipad")
    required: true

outputs:
  name:
    description: Seçilen simülatörün adı
    value: ${{ steps.sim.outputs.name }}
  udid:
    description: Seçilen simülatörün kimliği; sonraki adımlar aygıtı bununla hedefler
    value: ${{ steps.sim.outputs.udid }}

runs:
  using: composite
  steps:
    - name: Xcode
      uses: ./.github/actions/xcode
    - name: Paket önbelleği
      uses: actions/cache@v6
      with:
        # Yalnız paket indirmeleri; derleme ürünleri önbelleklenmez (bayat test paketi riski).
        # iOS ve macOS işleri aynı anahtarı paylaşır: içerik aynıdır. project.yml anahtara girer:
        # uygulama paketlerinin (SnapshotTesting) sürümü orada yazılıdır, kilit dosyası repoya girmez.
        path: ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
        key: spm-xcode-${{ hashFiles('Packages/Core/Package.resolved', 'project.yml') }}
        restore-keys: spm-xcode-
    - name: XcodeGen
      shell: bash
      run: brew install xcodegen
    - name: Projeyi üret
      shell: bash
      run: xcodegen generate
    # Ad ve UDID birlikte seçilir: sonraki adımlar aynı aygıtı kimliğiyle kullanır (aynı adı
    # taşıyan ikinci bir çalışma zamanı kurulursa hedef belirsizleşmez). En yeni çalışma zamanı önce.
    # iPhone: tercih listesi, yoksa herhangi bir iPhone. iPad: referanslar 13 inçlik ekranda çizilir
    # (pick-simulator.sh ile aynı liste); listeden hiçbiri yoksa adım düşer, başka bir iPad'e
    # sessizce geçmek görüntüleri değiştirir.
    - name: Simülatör seç
      id: sim
      shell: bash
      env:
        FAMILY: ${{ inputs.family }}
      run: |
        CHOSEN=$(xcrun simctl list devices available -j | python3 -c '
        import json, os, re, sys
        family = os.environ["FAMILY"]
        preferred = {
            "iphone": ["iPhone 17", "iPhone 16", "iPhone 15", "iPhone 14"],
            "ipad": ["iPad Pro 13-inch (M5)", "iPad Pro 13-inch (M4)", "iPad Air 13-inch (M4)",
                     "iPad Air 13-inch (M3)", "iPad Pro 13-inch"],
        }
        if family not in preferred:
            print("Bilinmeyen cihaz ailesi: " + repr(family) + " (iphone ya da ipad)", file=sys.stderr)
            sys.exit(1)
        names = preferred[family]
        data = json.load(sys.stdin)
        devices = []
        for runtime, entries in data.get("devices", {}).items():
            if "iOS" not in runtime:
                continue
            version = tuple(int(part) for part in re.findall(r"[0-9]+", runtime.rsplit("iOS", 1)[-1]))
            for device in entries:
                name = device.get("name", "")
                fits = name.startswith("iPhone") if family == "iphone" else name in names
                if device.get("isAvailable") and fits:
                    devices.append((version, name, device["udid"]))
        devices.sort(key=lambda entry: entry[0], reverse=True)
        order = names + [entry[1] for entry in devices] if family == "iphone" else names
        for name in order:
            for version, candidate, udid in devices:
                if candidate == name:
                    print(candidate + "|" + udid)
                    sys.exit(0)
        print("Uygun simülatör yok (" + family + "); aranan: " + ", ".join(names), file=sys.stderr)
        sys.exit(1)
        ')
        echo "name=${CHOSEN%%|*}" >> "$GITHUB_OUTPUT"
        echo "udid=${CHOSEN##*|}" >> "$GITHUB_OUTPUT"
        echo "Seçilen simülatör: ${CHOSEN%%|*} (${CHOSEN##*|})"
    # Derleme sırasında simülatör açılmaz: 3 çekirdekli runner'da açılış derlemeyle yarışıyordu
    # (paralel iki açılışla derleme 19 dk, biriyle 10 dk, açılışsız 4 dk) ve açılış sırasında
    # CoreSimulator aygıt listesi boş kalabiliyordu. Genel simülatör hedefi aynı ürünü (xctestrun)
    # verir; test adımları aygıtı kimlikle seçer. Runner ve simülatörler Apple silicon olduğu için
    # yalnız arm64 derlenir; x86_64 derlemesi süreyi uzatır.
    - name: iOS derlemesi (test için)
      shell: bash
      run: |
        xcodebuild build-for-testing \
          -project Journal.xcodeproj \
          -scheme Journal_iOS \
          -destination "generic/platform=iOS Simulator" \
          ARCHS=arm64 \
          CODE_SIGNING_ALLOWED=NO \
          -quiet
