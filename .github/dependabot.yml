# Bağımlılık güncellemeleri. Haftada bir, ekosistem başına tek PR.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore"
  - package-ecosystem: swift
    directory: /Packages/Core
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
