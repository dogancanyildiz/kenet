name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core-macos:
    name: Core (macOS)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Araç zinciri
        run: swift --version
      - name: Derle ve test et
        run: swift test --package-path Packages/Core -Xswiftc -warnings-as-errors

  # Linux'ta derleme, Core'un Apple çerçevelerinden bağımsız kalmasını zorlar:
  # SwiftUI, UIKit gibi modüller orada yoktur, import edilirse derleme düşer.
  core-linux:
    name: Core (Linux)
    runs-on: ubuntu-latest
    container: swift:6.4
    steps:
      - uses: actions/checkout@v7
      - name: Araç zinciri
        # GRDB sistem SQLite'ına bağlanır; kapta başlık dosyaları yoktur.
        run: |
          apt-get update -q && apt-get install -y -q libsqlite3-dev
          swift --version
      - name: Derle ve test et
        run: swift test --package-path Packages/Core -Xswiftc -warnings-as-errors

  # Uygulama hedefleri: proje project.yml dosyasından üretilir, iki platformda derlenir.
  # İmza yok (CODE_SIGNING_ALLOWED=NO); runner'da sertifika bulunmaz.
  app:
    name: Uygulama (iOS ve macOS)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: XcodeGen
        run: brew install xcodegen
      - name: Projeyi üret
        run: xcodegen generate
      - name: macOS derlemesi
        run: xcodebuild build -project Journal.xcodeproj -scheme Journal_macOS -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO -quiet
      - name: macOS testleri
        run: xcodebuild test -project Journal.xcodeproj -scheme Journal_macOS -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO -quiet
      - name: iOS derlemesi
        run: xcodebuild build -project Journal.xcodeproj -scheme Journal_iOS -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO -quiet

  # Biçim denetimi yereldeki ile aynı swift-format sürümünde koşar (Swift 6.4).
  lint:
    name: Biçim ve kurallar
    runs-on: ubuntu-latest
    container: swift:6.4
    steps:
      - uses: actions/checkout@v7
      - name: Biçim ve lint
        run: swift format lint --strict --recursive Packages App
      - name: Core içinde yasak import
        run: sh .github/scripts/check-core-imports.sh
      - name: Belgelerin yeri
        # Kap içinde depo başka bir kullanıcıya aittir; git onu güvenli saymadan çalışmaz.
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          sh .github/scripts/check-doc-locations.sh
      - name: Sürüm akışı kuru koşusu
        run: sh .github/scripts/test-release.sh

  # Dal korumasının zorunlu tuttuğu tek denetim. Yol filtresi yoktur; her PR'da koşar.
  ci:
    name: ci
    if: always()
    needs: [core-macos, core-linux, app, lint]
    runs-on: ubuntu-latest
    steps:
      - name: Tüm işler başarılı mı
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Sonuçlar: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "Başarısız ya da atlanmış iş var."
              exit 1
            fi
          done
