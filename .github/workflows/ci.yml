name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Yalnız belge değiştiren PR'da Core ve uygulama işleri atlanır; "Biçim ve kurallar" her zaman
  # koşar. Karar .github/scripts/ci-changes.py betiğindedir: dar bir belge listesi dışındaki her
  # yol koddur, emin olunamayan her durumda her şey koşar. dev'e itmede atlama yoktur: art arda
  # birleştirmelerde önceki koşu iptal edilir (concurrency), son koşu ağacın tamamını sınamalıdır.
  changes:
    name: Değişen dosyalar
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.detect.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Fark ortak atadan alınır; sığ kopyada betik "kod değişti" der.
          fetch-depth: 0
      - name: Yalnız belge mi
        id: detect
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          result="docs_only=false"
          if [ "$EVENT" = "pull_request" ]; then
            result=$(python3 .github/scripts/ci-changes.py "$BASE" "$HEAD") || result="docs_only=false"
          else
            echo "Olay $EVENT: atlama yok, her şey koşar."
          fi
          [ "$result" = "docs_only=true" ] || result="docs_only=false"
          echo "$result"
          echo "$result" >> "$GITHUB_OUTPUT"

  # Linux'ta derleme, Core'un Apple çerçevelerinden bağımsız kalmasını zorlar:
  # SwiftUI, UIKit gibi modüller orada yoktur, import edilirse derleme düşer.
  core-linux:
    name: Core (Linux)
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: swift:6.4
    steps:
      - uses: actions/checkout@v7
      - name: SwiftPM önbelleği
        uses: actions/cache@v6
        with:
          path: Packages/Core/.build
          key: spm-${{ runner.os }}-${{ hashFiles('Packages/Core/Package.swift', 'Packages/Core/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-
      - name: Araç zinciri
        # GRDB sistem SQLite'ına bağlanır; kapta başlık dosyaları yoktur.
        run: |
          apt-get update -q && apt-get install -y -q libsqlite3-dev
          swift --version
      - name: Derle ve test et
        run: swift test --package-path Packages/Core -Xswiftc -warnings-as-errors

  # macOS koşucusu sınırlı (aynı anda en çok 5 iş): Core'un macOS testleri, ölçek bütçesi ve Mac
  # uygulama testleri tek işte sırayla koşar. Core düşse de Mac testleri koşar; iki sonuç birlikte
  # görünür. Mac testleri iki saat diliminde koşar (olay saati / gün kayması); ikinci saat dilimi ve
  # ölçek bütçesi yalnız dev'e birleşince. İmza yok (CODE_SIGNING_ALLOWED=NO); runner'da sertifika
  # bulunmaz. Süre: PR ~14, itme ~21 dk (tahmin); iş sınırı bunun ~1,5 katı.
  app-macos:
    name: Uygulama (macOS ve Core)
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - name: Xcode
        uses: ./.github/actions/xcode
      - name: SwiftPM önbelleği (Core)
        uses: actions/cache@v6
        with:
          path: Packages/Core/.build
          key: spm-${{ runner.os }}-${{ hashFiles('Packages/Core/Package.swift', 'Packages/Core/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-
      - name: Paket önbelleği (uygulama)
        uses: actions/cache@v6
        with:
          # .github/actions/ios-build ile aynı anahtar: iOS ve macOS işleri aynı paketleri indirir.
          # Yalnız paket indirmeleri; derleme ürünleri önbelleklenmez (bayat test paketi riski).
          path: ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: spm-xcode-${{ hashFiles('Packages/Core/Package.resolved', 'project.yml') }}
          restore-keys: spm-xcode-
      - name: XcodeGen
        run: brew install xcodegen
      - name: Projeyi üret
        id: project
        run: xcodegen generate
      - name: Core testleri
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: swift test --package-path Packages/Core -Xswiftc -warnings-as-errors
      # 5 yıllık sentetik kasada süre bütçeleri. Paylaşılan runner'larda kırılgan olduğu için kapı
      # değildir: adım düşse de iş geçer. Core testlerinin .build klasörünü kullanır.
      - name: Ölçek bütçesi (isteğe bağlı)
        if: github.event_name == 'push'
        continue-on-error: true
        timeout-minutes: 15
        env:
          SCALE_BUDGET_SECONDS: "1"
        run: >
          swift test --package-path Packages/Core
          --filter ScaleBudgetTests.fiveYearVaultStaysWithinOptInBudgets
          -Xswiftc -warnings-as-errors
      - name: macOS testleri (UTC)
        id: mac_utc
        if: ${{ !cancelled() && steps.project.outcome == 'success' }}
        timeout-minutes: 20
        env:
          TEST_RUNNER_KENET_REQUIRE_AX: "1"
          TZ: UTC
        # Mac görüntü kümeleri yalnız yerelde koşar (bkz. snapshot-suites.sh).
        run: xcodebuild test -project Journal.xcodeproj -scheme Journal_macOS -destination 'platform=macOS,arch=arm64' $(sh .github/scripts/snapshot-suites.sh --mac | sed 's#^#-skip-testing:JournalTests_macOS/#' | tr '\n' ' ') -resultBundlePath MacTests.xcresult CODE_SIGNING_ALLOWED=NO -quiet
      # PR kapısında da koşar: gün kayması hatası yalnız dev'e itmede yakalanıyordu (2026-10-20 incelemesi).
      - name: macOS testleri (Pacific/Auckland)
        id: mac_auckland
        timeout-minutes: 15
        env:
          TZ: Pacific/Auckland
          TEST_RUNNER_KENET_REQUIRE_AX: "1"
        run: xcodebuild test-without-building -project Journal.xcodeproj -scheme Journal_macOS -destination 'platform=macOS,arch=arm64' $(sh .github/scripts/snapshot-suites.sh --mac | sed 's#^#-skip-testing:JournalTests_macOS/#' | tr '\n' ' ') -resultBundlePath MacTestsAuckland.xcresult CODE_SIGNING_ALLOWED=NO -quiet
      # Düşen beklentinin ölçülen değerleri -quiet günlüğünde görünmez; paket gösterir. İptal edilen
      # koşuda yüklenmez (boş paket üretiyordu).
      - name: macOS test sonuç paketi (yalnız düşünce)
        if: failure() && (steps.mac_utc.outcome == 'failure' || steps.mac_auckland.outcome == 'failure')
        uses: actions/upload-artifact@v7
        with:
          name: mac-test-results
          path: |
            MacTests.xcresult
            MacTestsAuckland.xcresult
          if-no-files-found: warn
          retention-days: 7

  # iOS iki işe cihaz ailesine göre bölünür: her runner'da tek simülatör. Bir runner'da iki
  # simülatör derlemeyi uzatıyor ve "Unable to find a device" ile asılma hatalarını üretiyordu.
  # Her iş kendi derlemesini yapar (simülatörsüz ~4 dk) ve simülatörü derlemeden sonra açar; ortak
  # başlangıç .github/actions/ios-build içindedir. Test adımları bilinen iki simülatör altyapı
  # hatasında bir kez yeniden dener (.github/scripts/xcodebuild-retry.sh); adım zaman aşımları
  # yeniden denemeyi de sınırlar. Bir test adımı düşse de aynı simülatördeki sonraki adımlar koşar:
  # bütün sonuçlar ve fark paketleri birlikte görünür.
  #
  # iPhone: birim testleri, görüntü kümeleri, arayüz dumanı. Arayüz dumanı yeni açılmış simülatörde
  # 2,3 kat yavaş koştu (682 sn, ısınmış simülatörde 243-427); birim testlerinden sonra koşunca bu
  # bedel bir kez ödenir. Süre ~26-30 dk (tahmin); iş sınırı ~1,5 katı.
  app-iphone:
    name: Uygulama (iPhone)
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Derle
        id: build
        uses: ./.github/actions/ios-build
        with:
          family: iphone
      # Simülatörün hazır olması testlerden ayrı adımda beklenir: bir asılmanın açılışta mı testte mi
      # olduğu adım sürelerinden okunur.
      - name: iPhone simülatörü aç
        id: ios_boot
        timeout-minutes: 10
        run: xcrun simctl bootstatus "${{ steps.build.outputs.udid }}" -b
      # Bu adım ara sıra hiçbir test düşmeden asılıyor (bkz. docs/architecture.md, "iOS test asılması").
      # Zaman aşımı ADIM düzeyindedir: iş düzeyindeki süre dolunca sonraki adımlar koşmaz, tanılama
      # yüklenemez. Çıktı -quiet değildir ve dosyaya yazılır: başlayıp bitmeyen test oradan okunur.
      # Normal süre 3-8 dk; 12. dakikada hâlâ koşuyorsa süreçler asılıyken yığın örneği alınır.
      # Test başına 300 sn sınırı Xcode 27'de Swift Testing'e de ulaşır ("Time limit was exceeded",
      # test adıyla; CI'daki Xcode sürümünde ölçülmedi, etkisizse zararsızdır). En yavaş test yerelde
      # 10 sn sürer. Sınır görevi iptal eder, iptale bakmadan bekleyen testi durduramaz: o durumda adı
      # günlüğe yazılır, adımı zaman aşımı bitirir.
      - name: iOS birim testleri
        id: ios_unit
        timeout-minutes: 20
        run: |
          mkdir -p ios-test-diagnostics
          sh .github/scripts/ios-test-diagnostics.sh ios-test-diagnostics "${{ steps.build.outputs.udid }}" 720 \
            > ios-test-diagnostics/watch.log 2>&1 &
          WATCH=$!
          trap 'kill "$WATCH" 2>/dev/null || true' EXIT
          sh .github/scripts/xcodebuild-retry.sh "${{ steps.build.outputs.udid }}" test-without-building \
            -project Journal.xcodeproj \
            -scheme Journal_iOS \
            -destination "platform=iOS Simulator,id=${{ steps.build.outputs.udid }},arch=arm64" \
            -only-testing:JournalTests_iOS \
            $(sh .github/scripts/snapshot-suites.sh | sed 's#^#-skip-testing:JournalTests_iOS/#' | tr '\n' ' ') \
            -resultBundlePath IOSTests.xcresult \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 300 \
            -maximum-test-execution-time-allowance 300 \
            CODE_SIGNING_ALLOWED=NO \
            > ios-test-diagnostics/xcodebuild.log 2>&1 || {
              echo "iOS birim testleri düştü; tam çıktı ios-test-results paketinde (xcodebuild.log). Düşenler:"
              grep -E "^✘|error:|ASILDI|Restarting after|\*\* TEST" ios-test-diagnostics/xcodebuild.log | tail -n 200
              exit 1
            }
          tail -n 5 ios-test-diagnostics/xcodebuild.log
      - name: iOS birim testi tanılaması (düşünce ya da zaman aşımında)
        if: failure() && (steps.ios_boot.outcome == 'failure' || steps.ios_unit.outcome == 'failure')
        timeout-minutes: 5
        run: |
          echo "Günlüğün sonu (başlayıp bitmeyen test burada görünür):"
          tail -n 60 ios-test-diagnostics/xcodebuild.log || true
          sh .github/scripts/ios-test-diagnostics.sh ios-test-diagnostics "${{ steps.build.outputs.udid }}"
      - name: iOS test sonuç paketi (düşünce ya da zaman aşımında)
        if: failure() && (steps.ios_boot.outcome == 'failure' || steps.ios_unit.outcome == 'failure')
        uses: actions/upload-artifact@v7
        with:
          name: ios-test-results
          path: |
            IOSTests.xcresult
            ios-test-diagnostics
          if-no-files-found: warn
          retention-days: 7
      # Ekran görüntüsü: birim katmanında SwiftUI çizimi (uygulama açılmaz). Kümeler ad kuralından
      # bulunur (.github/scripts/snapshot-suites.sh). Süreç dili Türkçe: görüntüler tr yerel ayarıyla
      # çizilir; String(localized:) ile aynı dil. Birim testlerinin simülatörde bıraktığı uygulama
      # durumu görüntüleri kaydırır (record-screen-snapshots.sh ile aynı kural): uygulama önce kaldırılır.
      - name: iPhone ekran görüntüsü
        id: screen_snapshots
        if: ${{ !cancelled() && steps.ios_boot.outcome == 'success' }}
        timeout-minutes: 20
        run: |
          APP=$(sed -n 's/^ *APP_BUNDLE_IDENTIFIER: *//p' project.yml)
          for bundle in "$APP" "$APP.testhost" "$APP.uitests.xctrunner"; do
            xcrun simctl uninstall "${{ steps.build.outputs.udid }}" "$bundle" >/dev/null 2>&1 || true
          done
          sh .github/scripts/xcodebuild-retry.sh "${{ steps.build.outputs.udid }}" test-without-building \
            -project Journal.xcodeproj \
            -scheme Journal_iOS \
            -destination "platform=iOS Simulator,id=${{ steps.build.outputs.udid }},arch=arm64" \
            $(sh .github/scripts/snapshot-suites.sh | sed 's#^#-only-testing:JournalTests_iOS/#' | tr '\n' ' ') \
            -testLanguage tr -testRegion TR \
            -resultBundlePath ScreenSnapshots.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            -quiet
      - name: Ekran görüntüsü farkları (yalnız düşünce)
        if: failure() && steps.screen_snapshots.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: screen-snapshot-diffs
          path: |
            ScreenSnapshots.xcresult
            Tests/JournalTests/Snapshots/__Snapshots__
          if-no-files-found: warn
          retention-days: 7
      # Test başına sınır (XCTest, dakikaya yuvarlanır): sessiz asılma adımı öldürmek yerine test
      # adıyla düşer. En uzun arayüz testi CI'da ~2,5 dk (iPad erişilebilirlik denetimi 141 sn).
      - name: iOS arayüz dumanı
        id: ios_ui
        if: ${{ !cancelled() && steps.ios_boot.outcome == 'success' }}
        timeout-minutes: 20
        run: |
          sh .github/scripts/xcodebuild-retry.sh "${{ steps.build.outputs.udid }}" test-without-building \
            -project Journal.xcodeproj \
            -scheme Journal_iOS \
            -destination "platform=iOS Simulator,id=${{ steps.build.outputs.udid }},arch=arm64" \
            -only-testing:JournalUITests \
            -resultBundlePath UITests.xcresult \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 300 \
            -maximum-test-execution-time-allowance 300 \
            CODE_SIGNING_ALLOWED=NO \
            -quiet
      - name: Arayüz testi sonuç paketi (yalnız düşünce)
        if: failure() && steps.ios_ui.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: ui-test-results
          path: UITests.xcresult
          retention-days: 7

  # iPad: görüntü kümeleri (snapshot-suites.sh --pad) ve erişilebilirlik denetimi, yeni açılmış
  # tek simülatörde. iPad referansları dik duran simülatörde çizilir; denetim aygıtı yatay döndürür
  # ve bitince dik bırakır, bu yüzden görüntüler önce koşar. Süre ~20-22 dk (tahmin); iş sınırı ~1,5 katı.
  app-ipad:
    name: Uygulama (iPad)
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - name: Derle
        id: build
        uses: ./.github/actions/ios-build
        with:
          family: ipad
      - name: iPad simülatörü aç
        id: pad_boot
        timeout-minutes: 10
        run: xcrun simctl bootstatus "${{ steps.build.outputs.udid }}" -b
      # Yeni açılmış iPad'de ilk test adımı yavaştır (yerelde ~3, CI'da 8-9 dk).
      - name: iPad ekran görüntüsü
        id: pad_snapshots
        timeout-minutes: 20
        run: |
          sh .github/scripts/xcodebuild-retry.sh "${{ steps.build.outputs.udid }}" test-without-building \
            -project Journal.xcodeproj \
            -scheme Journal_iOS \
            -destination "platform=iOS Simulator,id=${{ steps.build.outputs.udid }},arch=arm64" \
            $(sh .github/scripts/snapshot-suites.sh --pad | sed 's#^#-only-testing:JournalTests_iOS/#' | tr '\n' ' ') \
            -testLanguage tr -testRegion TR \
            -resultBundlePath PadSnapshots.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            -quiet
      - name: iPad ekran görüntüsü farkları (yalnız düşünce)
        if: failure() && steps.pad_snapshots.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: pad-snapshot-diffs
          path: |
            PadSnapshots.xcresult
            Tests/JournalTests/Snapshots/__Snapshots__/Pad*
          if-no-files-found: warn
          retention-days: 7
      # Aynı derleme ürünü UI test koşucusunu da taşır (ios-build: build-for-testing, Journal_iOS).
      # Denetim bölünmüş kabukta kenar çubuğuyla gezer ve aygıtı yatay döndürür; bitince dik bırakır.
      # Dil ayarı iPhone arayüz dumanıyla aynı (verilmez). Yerelde ~1,5 dk, CI'da ~2,5 dk. Test başına
      # sınır iPhone arayüz dumanıyla aynı: sessiz asılma test adıyla düşer.
      - name: iPad erişilebilirlik denetimi
        id: pad_a11y
        if: ${{ !cancelled() && steps.pad_boot.outcome == 'success' }}
        timeout-minutes: 15
        run: |
          sh .github/scripts/xcodebuild-retry.sh "${{ steps.build.outputs.udid }}" test-without-building \
            -project Journal.xcodeproj \
            -scheme Journal_iOS \
            -destination "platform=iOS Simulator,id=${{ steps.build.outputs.udid }},arch=arm64" \
            -only-testing:JournalUITests/AccessibilityAuditUITests \
            -resultBundlePath PadAccessibility.xcresult \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 300 \
            -maximum-test-execution-time-allowance 300 \
            CODE_SIGNING_ALLOWED=NO \
            -quiet
      - name: iPad erişilebilirlik sonuç paketi (yalnız düşünce)
        if: failure() && steps.pad_a11y.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: pad-a11y-results
          path: PadAccessibility.xcresult
          retention-days: 7

  # Biçim denetimi yereldeki ile aynı swift-format sürümünde koşar (Swift 6.4).
  lint:
    name: Biçim ve kurallar
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: swift:6.4
    steps:
      - uses: actions/checkout@v7
      - name: Biçim ve lint
        run: swift format lint --strict --recursive Packages App Tests
      - name: Core içinde yasak import
        run: sh .github/scripts/check-core-imports.sh
      - name: Belgelerin yeri
        # Kap içinde depo başka bir kullanıcıya aittir; git onu güvenli saymadan çalışmaz.
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          sh .github/scripts/check-doc-locations.sh
      - name: Belge biçim denetimi
        # swift:6.4 kabında python3 yoktur; denetim betiği onu kullanır.
        run: |
          apt-get update -q && apt-get install -y -q python3 >/dev/null
          sh .github/scripts/check-docs.sh
      - name: Belgelerde takım kimliği
        # Aynı kural uygulama testlerinde de var; belge PR'ında o işler atlandığı için burada da koşar.
        run: sh .github/scripts/check-team-id.sh
      - name: Görüntü referansı tavanı
        # Karar 61: her referans git geçmişinde kalır; sayı ve boyut tavanı Linux kabında ölçülür.
        run: |
          sh .github/scripts/test-check-snapshot-budget.sh
          sh .github/scripts/check-snapshot-budget.sh
      - name: Sürüm akışı kuru koşusu
        run: sh .github/scripts/test-release.sh
      - name: Xcode simülatör yeniden deneme betiği
        run: sh .github/scripts/test-xcodebuild-retry.sh
      - name: TestFlight geçici derleme temizliği
        run: python3 .github/scripts/test-testflight.py
      - name: CI betikleri (değişen dosyalar, birleştirici karar)
        run: |
          python3 .github/scripts/test-ci-changes.py
          python3 .github/scripts/test-ci-gate.py
          python3 -I .github/scripts/test-check-catalog-keys.py

  # Dal korumasının zorunlu tuttuğu tek denetim. Yol filtresi yoktur; her PR'da koşar.
  # Karar .github/scripts/ci-gate.py betiğindedir: atlanan iş yalnız belge PR'ında başarı sayılır,
  # düşen ya da iptal olan iş hiçbir zaman; argümandaki işlerin atlanmasına hiç izin yoktur.
  # PR'da her zaman koşar: iptal edilen PR koşusu kırmızı kalır, birleşme kapısı kapanır. dev'e
  # itmede koşu iptal edildiyse (yeni birleşme önceki koşuyu concurrency ile keser) koşmaz: iptal
  # kırmızı değil gri görünür. dev itmesini ruleset denetlemez; son koşu ağacın tamamını sınar.
  ci:
    name: ci
    if: ${{ always() && (github.event_name == 'pull_request' || !cancelled()) }}
    needs: [changes, core-linux, app-macos, app-iphone, app-ipad, lint]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Tüm işler başarılı mı
        env:
          NEEDS: ${{ toJSON(needs) }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
        run: python3 .github/scripts/ci-gate.py changes lint
