name: Ekran görüntüsü referansları

# Elle tetiklenir: yeni referans PNG'leri üretir ve artifact olarak yükler.
# İndirip Tests/JournalTests/Snapshots/__Snapshots__/ altına koy; PR'da commit et.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  record:
    name: Referans üret (iOS)
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Paket önbelleği
        uses: actions/cache@v6
        with:
          # Betik -derivedDataPath .dd/snapshots kullanır; paketler orada durur.
          path: .dd/snapshots/SourcePackages
          key: spm-xcode-ios-snapshots-${{ hashFiles('Packages/Core/Package.resolved') }}
          restore-keys: spm-xcode-ios-snapshots-
      - name: XcodeGen
        run: brew install xcodegen
      - name: Referansları kaydet
        env:
          # Yalnız eşleşmeyen ya da eksik referanslar yazılır; eşleşenler aynı kalır.
          SNAPSHOT_TESTING_RECORD: failed
        run: sh .github/scripts/record-screen-snapshots.sh
      - name: Referans artifact
        uses: actions/upload-artifact@v7
        with:
          name: screen-snapshot-references
          path: Tests/JournalTests/Snapshots/__Snapshots__
          retention-days: 14
