name: Release

# main'e her birleştirme bir sürümdür: VERSION dosyasındaki numara etiketlenir ve
# GitHub Release oluşturulur. Etiket zaten varsa (örneğin hotfix sonrası geri birleştirme
# dev'den geldiğinde değil, aynı numarayla ikinci bir birleştirmede) iş hata vermez, atlar.

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    name: Etiket ve Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Sürümü oku
        id: version
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "VERSION geçersiz: '$version'"; exit 1; }
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - name: Etiketi ve Release'i oluştur
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null || gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG zaten var, atlanıyor."
            exit 0
          fi
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
          echo "$TAG oluşturuldu."
