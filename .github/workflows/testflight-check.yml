name: TestFlight denetimi

# dev'e itilince imzasız arşiv alıp paketi denetler; yükleme yok.
# Ortak .github/actions/ios-build test için derler. Bu iş arşivler: testflight.sh temiz
# kopyada kendi xcodegen'ini çalıştırır, simülatör istemez. Xcode sürümü ci.yml işleriyle
# aynı yerden seçilir (.github/actions/xcode); XcodeGen kurulumu o işlerle aynı adımdır.
# dev itmesinde CD açıksa (depo değişkeni KENET_CD_ON_PUSH=true) bu iş atlanır: testflight.yml
# aynı denetimi imzalı arşivde yapar ve ikinci bir macOS işi kuyruğu uzatır.

on:
  push:
    branches: [dev]

concurrency:
  group: testflight-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: İmzasız arşiv denetimi
    if: vars.KENET_CD_ON_PUSH != 'true'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # Yapı numarası git rev-list --count HEAD'dir. Sığ kopyada betik 1 yazar,
          # denetim de 1 sayar; gerçek numara için tam geçmiş gerekir.
          fetch-depth: 0
      - name: Xcode
        uses: ./.github/actions/xcode
      - name: XcodeGen
        run: brew install xcodegen
      - name: Denetle
        env:
          # Arşiv düşünce betik günlüğü $TMPDIR/kenet-testflight-arsiv.log dosyasına bırakır.
          TMPDIR: ${{ runner.temp }}
        run: sh .github/scripts/testflight.sh --check
      - name: Arşiv günlüğü (düşünce)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: testflight-archive-log
          path: ${{ runner.temp }}/kenet-testflight-arsiv.log
          if-no-files-found: warn
          retention-days: 7
