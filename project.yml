# Xcode projesi bu dosyadan üretilir: `xcodegen generate` (Journal.xcodeproj takip edilmez).
# Kaynaklar klasör eşlemeli (syncedFolder) eklendiği için yeni dosya için yeniden üretim gerekmez.
name: Journal

options:
  # GEÇİCİ kimlik: yalnızca simülatör ve yerel çalıştırma için. Kalıcı kimlik, iCloud kapsayıcısı
  # ve App Group kullanıcı kararıyla belirlenecek (docs/decisions.md, açık sorular).
  bundleIdPrefix: com.dravcore.journal.dev
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  Core:
    path: Packages/Core
  # Ekran görüntüsü testleri (birim katmanı). CI ile yerel Xcode farkı için algısal tolerans kullanılır.
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    from: 1.18.0

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    CURRENT_PROJECT_VERSION: 1
    GENERATE_INFOPLIST_FILE: YES
    # Sürüm numarası kök dizindeki VERSION dosyasından okunur (bkz. "Sürümü yaz" betiği).
    MARKETING_VERSION: 0.0.0
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_LANGUAGE: tr
    # Xcode derlemede String Catalog'u yeniden yazmasın: anahtarlar elle eklenir,
    # eksikleri .github/scripts/check-docs.sh yakalar.
    SWIFT_EMIT_LOC_STRINGS: NO

targets:
  Journal:
    type: application
    platform: [iOS, macOS]
    sources:
      - path: App
        type: syncedFolder
        excludes:
          # Simgenin vektör kaynağı depoda durur ama uygulama paketine girmez.
          - "Support/AppIcon/**"
    dependencies:
      - package: Core
        product: VaultFormat
      - package: Core
        product: VaultIndex
      - package: Core
        product: VaultStore
      - package: Core
        product: EntityRecognition
      - package: Core
        product: DateParsing
      - package: Core
        product: GoalTracking
      - package: Core
        product: Summaries
    settings:
      base:
        PRODUCT_NAME: Journal
        PRODUCT_BUNDLE_IDENTIFIER: com.dravcore.journal.dev
        INFOPLIST_KEY_CFBundleDisplayName: Journal
        INFOPLIST_KEY_NSFaceIDUsageDescription: Günlüğünün kilidini açmak için Face ID kullanılır.
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: Bugünün takvim etkinliklerini göstermek için takvim erişimi gerekir. Etkinlikler değiştirilmez.
        INFOPLIST_KEY_NSLocationAlwaysAndWhenInUseUsageDescription: Konum hedeflerini bölgeye girdiğinde işaretlemek veya bildirmek için arka planda konum erişimi gerekir.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Yakındaki konumları hızlı girişte önermek için konumuna erişilir.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        # Documents/Vault appears in Files (On My iPhone → Journal) and can open in place.
        # INFOPLIST_KEY_UIFileSharingEnabled is ignored by current Xcode GENERATE_INFOPLIST_FILE
        # on some SDKs; merge an explicit plist instead (keys kept for documentation/tests).
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_FILE: App/Support/FileSharing.plist
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # App icon set; PNGs are generated by .github/scripts/render-app-icon.swift.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "-"
    entitlements:
      path: App/Support/Journal.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.personal-information.calendars: true
        com.apple.security.personal-information.location: true
    postBuildScripts:
      - name: Sürümü yaz
        script: |
          version=$(tr -d '[:space:]' < "$SRCROOT/VERSION")
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $version" "$TARGET_BUILD_DIR/$INFOPLIST_PATH"
        inputFiles:
          - $(SRCROOT)/VERSION
        basedOnDependencyAnalysis: false

  # Aynı kaynaklar iOS ve macOS'ta koşar. Mac-only testler `#if os(macOS)` ile
  # derlenmez (MacQuickEntryTests). Ayrı JournalTests_iOS hedefi yerine platform
  # dizisi: uygulama hedefiyle aynı kalıp, tek kaynak yolu, `${platform}` bağımlılığı.
  JournalTests:
    type: bundle.unit-test
    platform: [iOS, macOS]
    sources:
      - path: Tests/JournalTests
        excludes:
          # Referans PNG'ler depoda durur ama derlemeye girmez (silince Xcode kırılmasın).
          - "**/__Snapshots__/**"
    dependencies:
      - target: Journal_${platform}
      - package: SnapshotTesting
        product: SnapshotTesting
    settings:
      base:
        PRODUCT_NAME: JournalTests
        PRODUCT_BUNDLE_IDENTIFIER: com.dravcore.journal.dev.tests

  # Fixture kasasıyla XCUITest dumanı ve erişilebilirlik denetimi (iOS simülatör).
  JournalUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/JournalUITests
    dependencies:
      - target: Journal_iOS
    settings:
      base:
        PRODUCT_NAME: JournalUITests
        PRODUCT_BUNDLE_IDENTIFIER: com.dravcore.journal.dev.uitests
        # XCUIElement / interruption monitors are not Sendable; keep UI tests compiling under
        # complete concurrency for the app while relaxing only this target.
        SWIFT_STRICT_CONCURRENCY: minimal

schemes:
  Journal_macOS:
    build:
      targets:
        Journal_macOS: all
    test:
      commandLineArguments:
        JOURNAL_NO_AUTOSTART: true
      # Forwarded so `SNAPSHOT_TESTING_RECORD=all xcodebuild test …` reaches the host (Mac suites).
      environmentVariables:
        SNAPSHOT_TESTING_RECORD: $(SNAPSHOT_TESTING_RECORD)
      targets:
        - JournalTests_macOS
  Journal_iOS:
    build:
      targets:
        Journal_iOS: all
    test:
      commandLineArguments:
        JOURNAL_NO_AUTOSTART: true
      # Forwarded so `SNAPSHOT_TESTING_RECORD=all xcodebuild test …` reaches the host.
      environmentVariables:
        SNAPSHOT_TESTING_RECORD: $(SNAPSHOT_TESTING_RECORD)
      targets:
        - JournalTests_iOS
        - JournalUITests