# Xcode projesi bu dosyadan üretilir: `xcodegen generate` (Journal.xcodeproj takip edilmez).
# Kaynaklar klasör eşlemeli (syncedFolder) eklendiği için yeni dosya için yeniden üretim gerekmez.
name: Journal

options:
  # GEÇİCİ kimlik: yalnızca simülatör ve yerel çalıştırma için. Kalıcı kimlik, iCloud kapsayıcısı
  # ve App Group kullanıcı kararıyla belirlenecek (docs/decisions.md, açık sorular).
  bundleIdPrefix: com.dravcore.journal.dev
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  Core:
    path: Packages/Core

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    CURRENT_PROJECT_VERSION: 1
    GENERATE_INFOPLIST_FILE: YES
    # Sürüm numarası kök dizindeki VERSION dosyasından okunur (bkz. "Sürümü yaz" betiği).
    MARKETING_VERSION: 0.0.0
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_LANGUAGE: tr
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  Journal:
    type: application
    platform: [iOS, macOS]
    sources:
      - path: App
        type: syncedFolder
    dependencies:
      - package: Core
        product: VaultFormat
      - package: Core
        product: VaultIndex
      - package: Core
        product: VaultStore
      - package: Core
        product: EntityRecognition
      - package: Core
        product: DateParsing
    settings:
      base:
        PRODUCT_NAME: Journal
        PRODUCT_BUNDLE_IDENTIFIER: com.dravcore.journal.dev
        INFOPLIST_KEY_CFBundleDisplayName: Journal
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "-"
    entitlements:
      path: App/Support/Journal.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
    postBuildScripts:
      - name: Sürümü yaz
        script: |
          version=$(tr -d '[:space:]' < "$SRCROOT/VERSION")
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $version" "$TARGET_BUILD_DIR/$INFOPLIST_PATH"
        inputFiles:
          - $(SRCROOT)/VERSION
        basedOnDependencyAnalysis: false

  JournalTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/JournalTests
    dependencies:
      - target: Journal_macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dravcore.journal.dev.tests

schemes:
  Journal_macOS:
    build:
      targets:
        Journal_macOS: all
    test:
      commandLineArguments:
        JOURNAL_NO_AUTOSTART: true
      targets:
        - JournalTests
